server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 50MB      # NF-09：附件 ≤ 50MB
      max-request-size: 60MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/wistrain_cloud?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true   # USER_ID -> userId（MySQL 列名大小写不敏感）

wistrain:
  jwt-secret: ${JWT_SECRET:change-me-wistrain-cloud-jwt-secret-key-2026-in-prod}
  jwt-hours: 12                # NF-06：令牌有效期 12 小时
  aes-key: ${AES_KEY:wistrain2026key1}   # NF-07：16 字节密钥，生产环境必须走环境变量
  upload-dir: ${UPLOAD_DIR:./data/upload}
